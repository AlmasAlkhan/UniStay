name: unistay-local
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: unistay
      POSTGRES_USER: unistay_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run local setup}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - database:/var/lib/postgresql/data
      - ./.local/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U unistay_admin -d unistay]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: 'true'
      SECRET_KEY: ${SECRET_KEY:?Run local setup}
      DATABASE_URL: postgresql://unistay_app:${POSTGRES_APP_PASSWORD}@db:5432/unistay
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      FRONTEND_URL: http://localhost:3000
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - uploads:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: ['sh','-c','python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --access-logfile - --error-logfile -']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  database:
  uploads:
